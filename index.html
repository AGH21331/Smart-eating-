function setLang(l){lang=l;document.documentElement.lang=l;document.documentElement.dir=T[l].dir;$('#langBtn').textContent=T[l].short;renderAll()}
function toast(msg,err=false){const x=$('#toast');x.textContent=msg;x.style.borderColor=err?'var(--danger)':'var(--line)';x.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove('show'),2600)}
function navLabels(){const labels=[$('[data-page="home"] span'),$('[data-page="scan"] span'),$('[data-page="recipes"] span'),$('[data-page="more"] span')];[tr('home'),tr('scan'),tr('recipes'),tr('more')].forEach((v,i)=>labels[i].textContent=v)}
function show(pageName){page=pageName;$$('.section').forEach(s=>s.classList.toggle('active',s.id===page));$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));renderSection();window.scrollTo({top:0,behavior:'smooth'})}
function renderSection(){if(page==='home')home();if(page==='scan')scan();if(page==='recipes')recipes();if(page==='more')more()}
function home(){const used=log.reduce((a,x)=>a+(+x.cal||0),0);$('#home').innerHTML=`<div class="hero"><p class="eyebrow">${tr('today')}</p><h2>${tr('calories')}</h2><div class="cal">${n(Math.max(0,2000-used))}</div><div class="unit">${tr('cal')} متبقية</div><div class="kpis"><div class="kpi"><b>140g</b><span>${tr('protein')}</span></div><div class="kpi"><b>220g</b><span>${tr('carbs')}</span></div><div class="kpi"><b>70g</b><span>${tr('fat')}</span></div><div class="kpi"><b>${n(used)}</b><span>${tr('calories')}</span></div></div></div><article class="card"><p class="eyebrow">Gemini</p><h2>${tr('ai')}</h2><p class="sub">${tr('aiDesc')}</p><button class="btn primary" id="goScan">${tr('analyze')} ✦</button></article><article class="card"><div class="recipe" style="border:0"><div class="recipe-thumb">🍽️</div><div><h3>${tr('recipes')}</h3><p>${RECIPES.length} ${tr('recipeCount')}</p></div><button class="iconbtn" id="goRecipes">›</button></div></article>`;$('#goScan').onclick=()=>show('scan');$('#goRecipes').onclick=()=>show('recipes')}
function scan(){const has=image?`<div class="preview"><img src="${image}" alt="meal"><button class="btn ghost" id="removeImage">${tr('clear')}</button></div>`:'';const res=result?`<article class="card"><div class="eyebrow">Gemini</div><h2>${esc(result.mealName||'Meal')}</h2><p class="sub">${esc(result.summary||'')}</p><div class="result-grid"><div class="result-box"><b>${n(result.nutrition?.calories)}</b><span>${tr('cal')}</span></div><div class="result-box"><b>${n(result.nutrition?.protein)}g</b><span>${tr('protein')}</span></div><div class="result-box"><b>${n(result.nutrition?.carbs)}g</b><span>${tr('carbs')}</span></div><div class="result-box"><b>${n(result.nutrition?.fat)}g</b><span>${tr('fat')}</span></div></div><p class="tiny" style="margin-top:12px">${tr('confidence')}: ${Math.round((result.confidence||0)*100)}%</p><h3>${tr('ingredients')}</h3>${(result.ingredients||[]).map(x=>`<div class="step">${esc(x)}</div>`).join('')}<h3>${tr('method')}</h3>${(result.cookingMethod||[]).map((x,i)=>`<div class="step">${i+1}. ${esc(x)}</div>`).join('')}<div class="grid2" style="margin-top:12px"><button class="btn secondary" id="speakResult">🔊 ${tr('speak')}</button><button class="btn primary" id="saveResult">${tr('save')}</button></div></article>`:'';$('#scan').innerHTML=`<article class="card"><p class="eyebrow">${tr('scan')}</p><h2>${tr('ai')}</h2><p class="sub">${tr('aiDesc')}</p><div class="grid2"><button class="btn primary" id="cameraBtn">${tr('camera')} 📷</button><button class="btn secondary" id="galleryBtn">${tr('gallery')} 🖼️</button></div>${has}<label class="sub" for="mealText">${tr('description')}</label><textarea class="textarea" id="mealText" placeholder="${tr('description')}">${esc(voiceText)}</textarea><div class="grid2" style="margin-top:10px"><button class="btn secondary" id="voiceBtn">${listening?tr('stop'):tr('voice')} 🎙️</button><button class="btn primary" id="analyzeBtn">${tr('analyze')} ✦</button></div><div class="notice">${tr('voiceFallback')}</div></article>${res}`;$('#cameraBtn').onclick=()=>$('#camera').click();$('#galleryBtn').onclick=()=>$('#gallery').click();$('#voiceBtn').onclick=voice;$('#analyzeBtn').onclick=analyze;if($('#removeImage'))$('#removeImage').onclick=()=>{image='';renderSection()};if($('#speakResult'))$('#speakResult').onclick=speakResult;if($('#saveResult'))$('#saveResult').onclick=saveResult}
function recipes(){const q=query.toLowerCase().trim();const arr=RECIPES.filter(r=>!q||Object.values(r.name).some(v=>v.toLowerCase().includes(q))||r.ingredients.join(' ').toLowerCase().includes(q));$('#recipes').innerHTML=`<article class="card"><div class="searchbar"><input id="recipeSearch" value="${esc(query)}" placeholder="${tr('searchPlaceholder')}"><button class="iconbtn" id="clearSearch">⌫</button></div>${arr.length?arr.map((r,i)=>`<div class="recipe"><div class="recipe-thumb">${r.emoji}</div><div><h3>${esc(r.name[lang])}</h3><p>${n(r.cal)} ${tr('cal')} · ${r.p}P · ${r.c}C · ${r.f}F</p></div><button class="iconbtn recipeOpen" data-i="${RECIPES.indexOf(r)}">›</button></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}</article>`;const inp=$('#recipeSearch');inp.oninput=e=>{query=e.target.value;recipes();setTimeout(()=>{const x=$('#recipeSearch');x.focus();x.setSelectionRange(x.value.length,x.value.length)},0)};$('#clearSearch').onclick=()=>{query='';recipes()};$$('.recipeOpen').forEach(b=>b.onclick=()=>openRecipe(+b.dataset.i))}
function more(){healthSection();$('#more').innerHTML=`<article class="card"><h2>${tr('settings')}</h2><p class="sub">${tr('languageFull')}</p><div class="lang-grid" style="margin-top:10px"><button class="chip ${lang==='ar'?'active':''}" id="l-ar">العربية</button><button class="chip ${lang==='fr'?'active':''}" id="l-fr">Français</button><button class="chip ${lang==='en'?'active':''}" id="l-en">English</button></div><div class="grid2" style="margin-top:12px"><button class="btn secondary" id="themeMore">${theme==='dark'?tr('dark'):tr('light')}</button><button class="btn primary" id="healthBtn">${tr('health')}</button></div><div id="healthBox" class="health">—</div></article><article class="card"><h2>${tr('history')}</h2>${log.length?log.slice(0,10).map(x=>`<div class="recipe"><div class="recipe-thumb">🍽️</div><div><h3>${esc(x.name)}</h3><p>${n(x.cal)} ${tr('cal')}</p></div></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}</article>`;$('#themeMore').onclick=toggleTheme;$('#healthBtn').onclick=health;$('#l-ar').onclick=()=>setLang('ar');$('#l-fr').onclick=()=>setLang('fr');$('#l-en').onclick=()=>setLang('en')}
async function health(){const box=$('#healthBox');if(!box)return;box.textContent='…';try{const r=await fetch('/api/health',{cache:'no-store'});const ct=r.headers.get('content-type')||'';const raw=await r.text();if(!ct.includes('application/json')){box.textContent=`HTTP ${r.status}\n${tr('server404')}`;return}const d=JSON.parse(raw);box.textContent=`${tr('backend')}: ${d.ok?'✓ '+tr('configured'):'✕ '+tr('missing')}\nAI: ${d.aiConfigured?'✓ '+tr('configured'):'✕ '+tr('missing')}\nModel: ${d.model}`}catch(e){box.textContent=`${tr('backend')}: ERROR\n${e.message}`}}
async function analyze(){const text=$('#mealText')?.value.trim()||'';if(!image&&!text){toast(tr('noInput'),true);return}const b=$('#analyzeBtn');b.disabled=true;b.textContent=tr('analyzing');try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang,text,image})});const d=await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);result=d;toast(tr('ready'))}catch(e){toast(e.message,true)}finally{renderSection()}}
function saveResult(){if(!result)return;log.unshift({name:result.mealName,cal:result.nutrition?.calories||0,time:Date.now()});localStorage.setItem('sm-log',JSON.stringify(log));toast(tr('ready'))}
function speakResult(){const text=`${result?.mealName||''}. ${result?.summary||''}`;if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang==='ar'?'ar-SA':lang==='fr'?'fr-FR':'en-US';speechSynthesis.speak(u)}else toast('TTS unavailable',true)}
function voice(){if(listening){try{rec?.stop()}catch{};return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang=lang==='ar'?'ar-SA':lang==='fr'?'fr-FR':'en-US';r.interimResults=false;r.continuous=false;r.onstart=()=>{listening=true;renderSection()};r.onresult=e=>{voiceText=e.results?.[0]?.[0]?.transcript||'';listening=false;renderSection();toast(tr('voiceDone'))};r.onerror=()=>{listening=false;renderSection();toast(tr('voiceUnavailable'),true);setTimeout(voiceRecord,250)};r.onend=()=>{listening=false;renderSection()};try{r.start();return}catch{}}voiceRecord()}
async function voiceRecord(){if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){toast(tr('voiceUnavailable'),true);return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const chunks=[];const mime=MediaRecorder.isTypeSupported('audio/ogg;codecs=opus')?'audio/ogg;codecs=opus':'audio/webm';const r=new MediaRecorder(stream,{mimeType:mime});rec=r;listening=true;renderSection();r.ondataavailable=e=>e.data.size&&chunks.push(e.data);r.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());listening=false;const blob=new Blob(chunks,{type:r.mimeType});try{const data=await blobToDataURL(blob);const res=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang,audio:data})});const d=await res.json();if(!res.ok)throw new Error(d.error||'Voice error');voiceText=d.text||'';renderSection();toast(tr('voiceDone'))}catch(e){renderSection();toast(e.message,true)}};r.start();setTimeout(()=>{if(r.state==='recording')r.stop()},6000)}catch(e){toast(e.message,true)}}
function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
function openRecipe(i){const r=RECIPES[i];$('#modal').classList.add('show');$('#sheet').innerHTML=`<div class="sheet-head"><div><p class="eyebrow">${tr('recipes')}</p><h2>${esc(r.name[lang])}</h2></div><button class="iconbtn" id="closeModal">×</button></div><div class="recipe" style="border:0"><div class="recipe-thumb">${r.emoji}</div><div><p>${n(r.cal)} ${tr('cal')} · ${r.p}P · ${r.c}C · ${r.f}F</p></div></div><h3>${tr('ingredients')}</h3>${r.ingredients.map(x=>`<div class="step">• ${esc(x)}</div>`).join('')}<h3>${tr('method')}</h3>${r.steps.map((x,i)=>`<div class="step">${i+1}. ${esc(x)}</div>`).join('')}<button class="btn primary" style="width:100%;margin-top:14px" id="addRecipe">${tr('add')}</button>`;$('#closeModal').onclick=()=>$('#modal').classList.remove('show');$('#addRecipe').onclick=()=>{log.unshift({name:r.name[lang],cal:r.cal,time:Date.now()});localStorage.setItem('sm-log',JSON.stringify(log));$('#modal').classList.remove('show');toast(tr('ready'))}}
function toggleTheme(){theme=theme==='dark'?'light':'dark';localStorage.setItem('sm-theme',theme);applyTheme();renderSection()}
function setup(){applyTheme();navLabels();renderSection();$('#themeBtn').onclick=toggleTheme;$('#searchBtn').onclick=()=>show('recipes');$('#langBtn').onclick=()=>{const next=lang==='ar'?'fr':lang==='fr'?'en':'ar';setLang(next)};$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));$('#camera').onchange=e=>{const f=e.target.files?.[0];if(f){const rd=new FileReader();rd.onload=()=>{image=rd.result;show('scan')};rd.readAsDataURL(f)}};$('#gallery').onchange=$('#camera').onchange;$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
applyTheme();setup();
</script></body></html>
