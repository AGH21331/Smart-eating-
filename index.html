<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06110f">
<meta name="description" content="Smart Meal — AI nutrition companion">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/smartmeal-icon-192.png">
<title>Smart Meal</title>
<style>
:root{--bg:#06110f;--surface:#0d1a17;--surface2:#11221d;--line:#1f3b32;--text:#f6fbf8;--muted:#9ab0a8;--brand:#19d29b;--brand2:#0eaa7c;--danger:#ff6d75;--gold:#e0bf6b;--shadow:0 20px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:radial-gradient(900px 420px at 50% -10%,rgba(25,210,155,.16),transparent 60%),linear-gradient(180deg,#06110f,#071512 52%,#06110f);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh;overflow-x:hidden}
button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:not-allowed}
button:active{transform:scale(.985)}
.hidden{display:none!important}
.app{max-width:580px;margin:0 auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
.header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:16px}
.header-actions{display:flex;gap:8px;flex-shrink:0}.icon{width:46px;height:46px;border-radius:16px;background:rgba(8,23,19,.9);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:19px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}.brand img{width:48px;height:48px;border-radius:15px;object-fit:cover;box-shadow:0 10px 32px rgba(25,210,155,.18)}.brand-copy{min-width:0}.brand-title{margin:0;font-size:21px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}.brand-sub{margin:3px 0 0;color:var(--muted);font-size:10px;letter-spacing:.16em;white-space:nowrap}
.section{display:grid;gap:14px}.hero{background:linear-gradient(145deg,rgba(21,57,45,.9),rgba(8,25,20,.98));border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(25,210,155,.12);filter:blur(18px);inset:-60px auto auto -60px;pointer-events:none}
.eyebrow{margin:0;color:#87aaa0;font-weight:800;font-size:12px;letter-spacing:.1em}.hero-title{margin:4px 0 0;font-size:28px;line-height:1.1;font-weight:950}.hero-sub{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.cal-row{display:flex;align-items:end;gap:8px;margin-top:20px}.cal{font-size:44px;font-weight:950;letter-spacing:-.05em}.cal-unit{color:var(--muted);font-weight:800;margin-bottom:7px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.kpi{padding:11px 8px;border-radius:18px;background:rgba(4,16,13,.48);border:1px solid rgba(31,59,50,.9);text-align:center}.kpi b{display:block;font-size:18px}.kpi span{display:block;margin-top:2px;color:var(--muted);font-size:10px}
.card{background:rgba(12,28,23,.86);border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.card-title{margin:0;font-size:19px;font-weight:900}.card-sub{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:rgba(12,42,32,.8);border:1px solid #235a4a;color:#7de6c6;font-size:11px;font-weight:850;white-space:nowrap}
.primary,.secondary{width:100%;min-height:52px;border-radius:18px;padding:14px 16px;font-weight:900}.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#04150f;box-shadow:0 16px 35px rgba(25,210,155,.18)}.secondary{background:#0c1a16;color:var(--text);border:1px solid var(--line)}.ghost{background:transparent;color:var(--muted);border:0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.quick .secondary{display:grid;place-items:center;gap:6px;min-height:86px;font-size:12px}.quick strong{font-size:22px}
.scan-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scan-actions .secondary{min-height:72px}.scan-wide{grid-column:1/-1}
.preview{margin-top:12px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#07120f}.preview img{display:block;width:100%;max-height:300px;object-fit:cover}.preview-bar{padding:10px 12px;color:var(--muted);font-size:11px}
textarea,input[type=text]{width:100%;background:#071310;color:var(--text);border:1px solid var(--line);border-radius:18px;padding:14px;outline:none}.textarea{min-height:110px;resize:vertical}.search{display:grid;grid-template-columns:1fr auto;gap:8px}.search input{height:52px}.search button{width:52px;min-height:52px}
.recipe-grid{display:grid;gap:10px}.recipe{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:12px;border-radius:19px;border:1px solid var(--line);background:#091611}.recipe-media{width:52px;height:52px;border-radius:16px;background:linear-gradient(145deg,#17352b,#0b1d17);display:grid;place-items:center;font-size:26px}.recipe h3{margin:0;font-size:14px}.recipe p{margin:4px 0 0;color:var(--muted);font-size:11px}.small-icon{width:40px;height:40px;border-radius:13px;background:#0e201b;border:1px solid var(--line);color:var(--text)}
.result{margin-top:14px;padding:15px;border-radius:20px;background:#0a1713;border:1px solid #2a594b}.result-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.result-title{margin:7px 0 0;font-size:18px;font-weight:900}.result-desc{margin:6px 0 0;color:var(--muted);font-size:12px;line-height:1.6}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.macro div{background:#0e211b;border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}.macro b{display:block;font-size:16px}.macro span{display:block;color:var(--muted);font-size:9px;margin-top:2px}.ing{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid rgba(31,59,50,.45);font-size:12px}.ing:last-child{border-bottom:0}.notice{padding:12px;border-radius:16px;font-size:12px;line-height:1.6;background:#1f1910;border:1px solid #5f5024;color:#efdc9c}.notice.ok{background:#092018;border-color:#1b5d4b;color:#95dfc8}.notice.err{background:#251316;border-color:#6b2b33;color:#ffb7bc}
.health{font:12px/1.8 ui-monospace,monospace;white-space:pre-line;background:#06110f;border:1px dashed var(--line);border-radius:16px;padding:12px;color:#9fb8b0}.health.ok{color:#95dfc8}.health.err{color:#ffb7bc}
.nav{position:fixed;z-index:40;left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(580px,calc(100% - 20px));display:grid;grid-template-columns:repeat(4,1fr);padding:7px;border-radius:24px;background:rgba(4,16,13,.94);backdrop-filter:blur(18px);border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.38)}.nav button{min-width:0;background:transparent;color:#81978f;border-radius:17px;padding:10px 5px;font-size:10px;font-weight:900}.nav button.active{background:#0d3025;color:#65e6c3}.nav .nav-ico{display:block;font-size:18px;line-height:1;margin-bottom:4px}
.drawer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:none;align-items:flex-end}.drawer.show{display:flex}.sheet{width:min(580px,100%);background:#091714;border-top:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px;max-height:88vh;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.close{width:42px;height:42px;border-radius:14px;background:#10231d;border:1px solid var(--line);color:var(--text)}
.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px}.divider{height:1px;background:rgba(31,59,50,.55);margin:14px 0}
@media(max-width:460px){.app{padding-inline:12px}.brand-title{font-size:18px}.brand-sub{font-size:9px}.cal{font-size:38px}.kpis{grid-template-columns:repeat(2,1fr)}.header{grid-template-columns:1fr auto}.header .brand{order:1}.header .header-actions{order:2}.header .header-spacer{display:none}.scan-actions{grid-template-columns:1fr}.scan-wide{grid-column:auto}.quick{grid-template-columns:1fr 1fr 1fr}.nav{bottom:8px}.nav button{padding-inline:2px}}
</style>
</head>
<body>
<div id="root"></div>
<input id="camera" class="hidden" type="file" accept="image/*" capture="environment">
<input id="gallery" class="hidden" type="file" accept="image/*">
<div id="drawer" class="drawer" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<nav class="nav" id="nav" aria-label="Navigation"></nav>
<script>
'use strict';
const MODEL='gemini-3.6-flash';
const LANG={ar:{dir:'rtl',code:'ar',short:'AR',home:'الرئيسية',scan:'الماسح',recipes:'الوصفات',more:'المزيد',search:'بحث',today:'اليوم',summary:'ملخص يومك',cal:'سعرة',p:'بروتين',c:'كربوهيدرات',f:'دهون',aiTitle:'محلل الوجبات الذكي',aiSub:'صوّر وجبتك، اختر صورة، أو تحدث عنها. سيقدّر الذكاء الاصطناعي المكونات والسعرات والماكروز.',analyze:'حلّل الوجبة',camera:'الكاميرا',gallery:'المعرض',voice:'تحدث عن وجبتك',voiceStop:'إيقاف الاستماع',description:'وصف الوجبة',ph:'مثال: دجاج مشوي مع أرز وسلطة',searchTitle:'ابحث عن وصفة أو مكوّن',searchPh:'ابحث هنا…',discover:'اكتشف الوصفات',settings:'الإعدادات',language:'اللغة',theme:'المظهر',health:'فحص النظام',add:'إضافة للسجل',speak:'استمع',ingredients:'المكونات',suggestions:'اقتراحات',noImage:'اختر صورة أولًا.',noKey:'أضف GEMINI_API_KEY في Vercel لتشغيل AI.',voiceUnavailable:'التعرف على الصوت غير متاح في هذا المتصفح. جرّب Chrome.',voiceError:'تعذر تشغيل الميكروفون. تحقق من إذنه.',listening:'أستمع الآن… تحدث بوضوح.',processing:'جاري التحليل…',searchEmpty:'لا توجد نتائج. جرّب كلمة أخرى.',details:'التفاصيل',close:'إغلاق',languageChanged:'تم تغيير اللغة.',added:'تمت الإضافة إلى السجل.',backend:'الخادم',configured:'مهيأ',missing:'مفقود',version:'الإصدار',online:'متصل',offline:'غير متصل'},en:{dir:'ltr',code:'en',short:'EN',home:'Home',scan:'Scanner',recipes:'Recipes',more:'More',search:'Search',today:'Today',summary:'Your day at a glance',cal:'kcal',p:'Protein',c:'Carbs',f:'Fat',aiTitle:'Smart Meal Analyzer',aiSub:'Take a photo, choose an image, or talk about your meal. AI estimates ingredients, calories, and macros.',analyze:'Analyze meal',camera:'Camera',gallery:'Gallery',voice:'Talk about meal',voiceStop:'Stop listening',description:'Meal description',ph:'Example: grilled chicken with rice and salad',searchTitle:'Find a recipe or ingredient',searchPh:'Search here…',discover:'Discover recipes',settings:'Settings',language:'Language',theme:'Appearance',health:'System check',add:'Add to log',speak:'Listen',ingredients:'Ingredients',suggestions:'Suggestions',noImage:'Choose an image first.',noKey:'Add GEMINI_API_KEY in Vercel to enable AI.',voiceUnavailable:'Speech recognition is not available in this browser. Try Chrome.',voiceError:'Microphone could not start. Check permission.',listening:'Listening… speak clearly.',processing:'Analyzing…',searchEmpty:'No results. Try another word.',details:'Details',close:'Close',languageChanged:'Language changed.',added:'Added to your log.',backend:'Backend',configured:'Configured',missing:'Missing',version:'Version',online:'Online',offline:'Offline'},fr:{dir:'ltr',code:'fr',short:'FR',home:'Accueil',scan:'Scanner',recipes:'Recettes',more:'Plus',search:'Rechercher',today:"Aujourd’hui",summary:'Votre journée en un coup d’œil',cal:'kcal',p:'Protéines',c:'Glucides',f:'Lipides',aiTitle:'Analyseur de repas intelligent',aiSub:'Prenez une photo, choisissez une image ou parlez de votre repas. L’IA estime les ingrédients, calories et macros.',analyze:'Analyser le repas',camera:'Caméra',gallery:'Galerie',voice:'Parler du repas',voiceStop:'Arrêter',description:'Description du repas',ph:'Exemple : poulet grillé avec riz et salade',searchTitle:'Rechercher une recette ou un ingrédient',searchPh:'Rechercher ici…',discover:'Découvrir les recettes',settings:'Paramètres',language:'Langue',theme:'Apparence',health:'État du système',add:'Ajouter au journal',speak:'Écouter',ingredients:'Ingrédients',suggestions:'Suggestions',noImage:"Choisissez d’abord une image.",noKey:'Ajoutez GEMINI_API_KEY dans Vercel pour activer l’IA.',voiceUnavailable:'La reconnaissance vocale n’est pas disponible dans ce navigateur. Essayez Chrome.',voiceError:"Le microphone n’a pas pu démarrer. Vérifiez l’autorisation.",listening:'J’écoute… parlez clairement.',processing:'Analyse…',searchEmpty:'Aucun résultat. Essayez un autre mot.',details:'Détails',close:'Fermer',languageChanged:'Langue modifiée.',added:'Ajouté au journal.',backend:'Backend',configured:'Configuré',missing:'Manquant',version:'Version',online:'En ligne',offline:'Hors ligne'}};
const t=k=>LANG[state.lang][k]||k;
const RECIPES=[
{name:{ar:'دجاج مشوي مع أرز',en:'Grilled chicken & rice',fr:'Poulet grillé & riz'},emoji:'🍗',cal:620,p:48,c:58,f:18,ing:{ar:['دجاج','أرز','سلطة'],en:['Chicken','Rice','Salad'],fr:['Poulet','Riz','Salade']}},
{name:{ar:'سلطة تونة متوسطية',en:'Mediterranean tuna salad',fr:'Salade de thon méditerranéenne'},emoji:'🥗',cal:390,p:36,c:24,f:15,ing:{ar:['تونة','طماطم','زيت زيتون'],en:['Tuna','Tomato','Olive oil'],fr:['Thon','Tomate','Huile d’olive']}},
{name:{ar:'شوفان بالموز',en:'Banana oats',fr:'Avoine à la banane'},emoji:'🥣',cal:340,p:14,c:55,f:9,ing:{ar:['شوفان','موز','حليب'],en:['Oats','Banana','Milk'],fr:['Avoine','Banane','Lait']}},
{name:{ar:'بيض وأفوكادو',en:'Eggs & avocado',fr:'Œufs & avocat'},emoji:'🥑',cal:430,p:21,c:14,f:31,ing:{ar:['بيض','أفوكادو','خبز'],en:['Eggs','Avocado','Bread'],fr:['Œufs','Avocat','Pain']}}
];
const state={lang:localStorage.getItem('sm_lang')||'ar',page:'home',query:'',image:null,result:null,voice:null,searchOpen:false,theme:localStorage.getItem('sm_theme')||'dark',log:[],profile:{cal:2000,p:140,c:220,f:70}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=n=>new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0));
function setLanguage(code){if(!LANG[code])return;state.lang=code;localStorage.setItem('sm_lang',code);document.documentElement.lang=code;document.documentElement.dir=LANG[code].dir;render();toast(t('languageChanged'),'ok');}
function setTheme(){state.theme=state.theme==='dark'?'light':'dark';localStorage.setItem('sm_theme',state.theme);document.documentElement.dataset.theme=state.theme;render();}
function header(){return `<header class="header"><div class="header-actions"><button class="icon" data-action="theme" aria-label="${esc(t('theme'))}">${state.theme==='dark'?'☀':'◐'}</button><button class="icon" data-action="search" aria-label="${esc(t('search'))}">⌕</button></div><div class="brand"><img src="/smartmeal-icon-192.png" alt="Smart Meal"><div class="brand-copy"><h1 class="brand-title">Smart Meal</h1><p class="brand-sub">AI NUTRITION • PREMIUM</p></div></div><div class="header-actions"><button class="icon" data-action="language" aria-label="${esc(t('language'))}">${LANG[state.lang].short}</button></div></header>`}
function nav(){const tabs=[['home','⌂',t('home')],['scan','✦',t('scan')],['recipes','▣',t('recipes')],['more','☰',t('more')]];$('#nav').innerHTML=tabs.map(([id,ico,label])=>`<button class="${state.page===id?'active':''}" data-page="${id}"><span class="nav-ico">${ico}</span>${esc(label)}</button>`).join('');}
function appStart(){document.documentElement.dataset.theme=state.theme;document.documentElement.dir=LANG[state.lang].dir;document.documentElement.lang=state.lang;render();}
function render(){let body='';if(state.page==='home')body=home();else if(state.page==='scan')body=scan();else if(state.page==='recipes')body=recipes();else body=more();$('#root').innerHTML=`<main class="app">${header()}${body}</main>`;nav();bindPage();}
function home(){const consumed=state.log.reduce((s,x)=>s+(x.cal||0),0), remain=Math.max(0,state.profile.cal-consumed);return `<section class="section"><article class="hero"><p class="eyebrow">${esc(t('today').toUpperCase())}</p><h2 class="hero-title">${esc(t('summary'))}</h2><div class="cal-row"><div class="cal">${num(remain)}</div><div class="cal-unit">${esc(t('cal'))}</div></div><div class="kpis"><div class="kpi"><b>${num(state.profile.p)}</b><span>${esc(t('p'))}</span></div><div class="kpi"><b>${num(state.profile.c)}</b><span>${esc(t('c'))}</span></div><div class="kpi"><b>${num(state.profile.f)}</b><span>${esc(t('f'))}</span></div><div class="kpi"><b>${num(consumed)}</b><span>${esc(t('cal'))}</span></div></div></article><article class="card"><div class="card-head"><div><p class="eyebrow">AI</p><h2 class="card-title">${esc(t('aiTitle'))}</h2><p class="card-sub">${esc(t('aiSub'))}</p></div><span class="badge">● Gemini</span></div><button class="primary" data-page="scan" style="margin-top:14px">✦ ${esc(t('analyze'))}</button></article><article class="card"><div class="card-head"><h2 class="card-title">${esc(t('discover'))}</h2><button class="small-icon" data-action="search">⌕</button></div><div class="recipe-grid" style="margin-top:12px">${RECIPES.slice(0,3).map(recipe).join('')}</div></article></section>`}
function recipe(r,i){return `<article class="recipe"><div class="recipe-media">${r.emoji}</div><div><h3>${esc(r.name[state.lang])}</h3><p>${num(r.cal)} ${esc(t('cal'))} · ${num(r.p)}P · ${num(r.c)}C · ${num(r.f)}F</p></div><button class="small-icon" data-action="recipe" data-i="${i}">›</button></article>`}
function scan(){return `<section class="section"><article class="card"><div class="card-head"><div><p class="eyebrow">SMART SCAN</p><h2 class="card-title">${esc(t('aiTitle'))}</h2><p class="card-sub">${esc(t('aiSub'))}</p></div><span class="badge">AI</span></div><div class="scan-actions" style="margin-top:14px"><button class="secondary" data-action="camera"><strong>📷</strong>${esc(t('camera'))}</button><button class="secondary" data-action="gallery"><strong>🖼️</strong>${esc(t('gallery'))}</button><button class="secondary scan-wide" data-action="voice"><strong>${state.voice?'⏹':'🎙️'}</strong>${esc(state.voice?t('voiceStop'):t('voice'))}</button></div>${state.image?`<div class="preview"><img src="${state.image}" alt="Meal preview"><div class="preview-bar">${esc(t('details'))}</div></div>`:''}<textarea id="mealText" class="textarea" placeholder="${esc(t('ph'))}" style="margin-top:12px">${esc(state.result?.inputText||'')}</textarea><button class="primary" data-action="analyze" style="margin-top:12px">✦ ${esc(t('analyze'))}</button><div id="scanNotice" class="notice hidden" style="margin-top:12px"></div>${state.result?resultBox(state.result):''}</article><article class="card"><div class="card-head"><div><h2 class="card-title">${esc(t('health'))}</h2><p class="card-sub">${esc(t('backend'))} · ${esc(t('online'))}</p></div><button class="secondary" style="width:auto" data-action="health">${esc(t('health'))}</button></div><div id="healthBox" class="health" style="margin-top:12px">—</div></article></section>`}
function resultBox(r){const n=r.nutrition||{};return `<div class="result"><div class="result-head"><div><span class="badge">AI result</span><h3 class="result-title">${esc(r.mealName)}</h3><p class="result-desc">${esc(r.description)}</p></div><button class="small-icon" data-action="speak" title="${esc(t('speak'))}">🔊</button></div><div class="macro"><div><b>${num(n.calories)}</b><span>${esc(t('cal'))}</span></div><div><b>${num(n.protein)}g</b><span>${esc(t('p'))}</span></div><div><b>${num(n.carbs)}g</b><span>${esc(t('c'))}</span></div><div><b>${num(n.fat)}g</b><span>${esc(t('f'))}</span></div></div><div class="divider"></div><strong>${esc(t('ingredients'))}</strong>${(r.ingredients||[]).map(x=>`<div class="ing"><span>${esc(x.name)}</span><span class="muted">${esc(x.quantity)}</span></div>`).join('')}<button class="primary" data-action="add-result" style="margin-top:12px">${esc(t('add'))}</button></div>`}
function recipes(){let list=RECIPES;const q=state.query.trim().toLowerCase();if(q)list=list.filter(r=>(r.name[state.lang]+' '+r.ing[state.lang].join(' ')).toLowerCase().includes(q));return `<section class="section"><article class="card"><div class="card-head"><div><p class="eyebrow">${esc(t('search'))}</p><h2 class="card-title">${esc(t('searchTitle'))}</h2></div><span class="badge">${list.length}</span></div><div class="search" style="margin-top:14px"><input id="searchInput" type="text" value="${esc(state.query)}" placeholder="${esc(t('searchPh'))}"><button class="primary" data-action="search-submit">⌕</button></div><div class="recipe-grid" style="margin-top:14px">${list.length?list.map(recipe).join(''):`<div class="empty">${esc(t('searchEmpty'))}</div>`}</div></article></section>`}
function more(){return `<section class="section"><article class="card"><p class="eyebrow">${esc(t('more'))}</p><h2 class="card-title">${esc(t('settings'))}</h2><p class="card-sub">${esc(t('language'))} · ${esc(t('theme'))}</p><div class="quick" style="margin-top:14px"><button class="secondary" data-action="lang" data-l="ar"><strong>ع</strong>العربية</button><button class="secondary" data-action="lang" data-l="fr"><strong>FR</strong>Français</button><button class="secondary" data-action="lang" data-l="en"><strong>EN</strong>English</button></div><button class="secondary" data-action="theme" style="margin-top:12px">☼ ${esc(t('theme'))}</button></article><article class="card"><div class="card-head"><div><h2 class="card-title">${esc(t('health'))}</h2><p class="card-sub">API + browser capabilities</p></div><button class="secondary" style="width:auto" data-action="health">${esc(t('health'))}</button></div><div id="healthBox" class="health" style="margin-top:12px">—</div></article></section>`}
function bindPage(){const s=$('#searchInput');if(s)s.addEventListener('input',e=>{state.query=e.target.value;render()});}
function toast(msg,type='ok'){const n=$('#scanNotice');if(n){n.textContent=msg;n.className='notice '+(type==='err'?'err':'ok');}else{const x=document.createElement('div');x.className='notice '+(type==='err'?'err':'ok');x.textContent=msg;x.style.position='fixed';x.style.top='18px';x.style.left='50%';x.style.transform='translateX(-50%)';x.style.zIndex='100';x.style.width='min(92vw,520px)';document.body.appendChild(x);setTimeout(()=>x.remove(),2500)}}
function openSearch(){state.page='recipes';state.query='';render();setTimeout(()=>$('#searchInput')?.focus(),60)}
async function pickFile(input){const f=input.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Image only','err');const r=new FileReader();r.onload=()=>{state.image=r.result;state.page='scan';render()};r.readAsDataURL(f)}
async function analyze(){const text=$('#mealText')?.value.trim()||'';if(!state.image&&!text)return toast(t('noImage'),'err');toast(t('processing'));try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:state.image||'',text,language:state.lang})});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error(`AI server returned HTTP ${r.status}`)}if(!r.ok)throw new Error(d.error||t('noKey'));d.inputText=text;state.result=d;render();}catch(e){toast(e.message||'AI error','err')}}
async function health(){const box=$('#healthBox');if(!box)return;box.textContent='Checking…';try{const r=await fetch('/api/health',{cache:'no-store'});const ct=r.headers.get('content-type')||'';const raw=await r.text();if(!ct.includes('application/json')){box.className='health err';box.textContent=`${t('backend')}: ERROR\nHTTP ${r.status}\n/api/health is not deployed.`;return}const d=JSON.parse(raw);box.className='health '+(d.ok?'ok':'err');box.textContent=`${t('backend')}: ${d.ok?t('configured'):'ERROR'}\nAI: ${d.aiConfigured?t('configured'):t('missing')}\n${t('version')}: ${d.version}\nModel: ${d.model}`;}catch(e){box.className='health err';box.textContent=`${t('backend')}: ERROR\n${e.message}`}}
function startVoice(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast(t('voiceUnavailable'),'err');return}if(state.voice){try{state.voice.stop()}catch{};state.voice=null;render();return}try{const r=new SR();r.lang=state.lang==='ar'?'ar-SA':state.lang==='fr'?'fr-FR':'en-US';r.interimResults=false;r.continuous=false;r.onstart=()=>{state.voice=r;render()};r.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';const el=$('#mealText');if(el)el.value=(el.value+' '+text).trim();state.voice=null;render();toast(t('voiceDone'),'ok')};r.onerror=()=>{state.voice=null;render();toast(t('voiceError'),'err')};r.onend=()=>{state.voice=null;render()};state.voice=r;r.start()}catch{state.voice=null;toast(t('voiceError'),'err')}}
async function speak(){const r=state.result;if(!r)return;const text=`${r.mealName}. ${r.description}. ${r.nutrition?.calories||0} ${t('cal')}.`;try{const resp=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:state.lang})});const raw=await resp.text();let d;try{d=JSON.parse(raw)}catch{d=null}if(resp.ok&&d?.audioBase64){const bytes=Uint8Array.from(atob(d.audioBase64),c=>c.charCodeAt(0));const wav=new Uint8Array(44+bytes.length);const view=new DataView(wav.buffer);const ws=(o,v)=>{for(let i=0;i<v.length;i++)view.setUint8(o+i,v.charCodeAt(i))};ws(0,'RIFF');view.setUint32(4,36+bytes.length,true);ws(8,'WAVEfmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,24000,true);view.setUint32(28,48000,true);view.setUint16(32,2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,bytes.length,true);wav.set(bytes,44);const url=URL.createObjectURL(new Blob([wav],{type:'audio/wav'}));const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);await a.play();return}throw new Error(d?.error||'TTS unavailable')}catch(e){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=state.lang==='ar'?'ar-SA':state.lang==='fr'?'fr-FR':'en-US';speechSynthesis.speak(u);return}toast(e.message||t('voiceUnavailable'),'err')}}
function showRecipe(i){const r=RECIPES[i];const content=`<div class="sheet-head"><div><p class="eyebrow">${esc(t('details'))}</p><h2 class="card-title">${esc(r.name[state.lang])}</h2></div><button class="close" data-action="close">×</button></div><div class="recipe" style="margin-top:14px"><div class="recipe-media">${r.emoji}</div><div><h3>${esc(r.name[state.lang])}</h3><p>${num(r.cal)} ${esc(t('cal'))} · ${num(r.p)}P · ${num(r.c)}C · ${num(r.f)}F</p></div></div><div class="divider"></div><strong>${esc(t('ingredients'))}</strong>${r.ing[state.lang].map(x=>`<div class="ing"><span>${esc(x)}</span><span>✓</span></div>`).join('')}<button class="primary" data-action="add-recipe" data-i="${i}" style="margin-top:12px">${esc(t('add'))}</button>`;$('#sheet').innerHTML=content;$('#drawer').classList.add('show');}
function closeSheet(){$('#drawer').classList.remove('show')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;render();return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='theme')setTheme();else if(a==='search')openSearch();else if(a==='language')showRecipe?showLanguage():null;else if(a==='lang')setLanguage(b.dataset.l);else if(a==='camera')$('#camera')?.click();else if(a==='gallery')$('#gallery')?.click();else if(a==='voice')startVoice();else if(a==='analyze')analyze();else if(a==='health')health();else if(a==='search-submit'){state.query=$('#searchInput')?.value||'';render()}else if(a==='recipe')showRecipe(Number(b.dataset.i));else if(a==='close')closeSheet();else if(a==='speak')speak();else if(a==='add-result'){if(state.result){state.log.push({cal:state.result.nutrition?.calories||0});toast(t('added'),'ok')}}else if(a==='add-recipe'){const r=RECIPES[Number(b.dataset.i)];if(r){state.log.push({cal:r.cal});toast(t('added'),'ok');closeSheet()}}});
function showLanguage(){const c=`<div class="sheet-head"><div><p class="eyebrow">${esc(t('language'))}</p><h2 class="card-title">${esc(t('language'))}</h2></div><button class="close" data-action="close">×</button></div><div class="quick" style="margin-top:14px"><button class="secondary" data-action="lang" data-l="ar">العربية</button><button class="secondary" data-action="lang" data-l="fr">Français</button><button class="secondary" data-action="lang" data-l="en">English</button></div>`;$('#sheet').innerHTML=c;$('#drawer').classList.add('show')}
$('#camera').addEventListener('change',e=>pickFile(e.target));$('#gallery').addEventListener('change',e=>pickFile(e.target));$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeSheet()});
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
appStart();
</script>
</body>
</html>
