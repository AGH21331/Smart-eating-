<head>

<title>Smart Meal PRO</title>
<style>
:root{--bg:#07120f;--surface:#0d1b16;--surface2:#10251e;--line:#214136;--text:#f7fbf9;--muted:#9bb1a9;--brand:#20d5a0;--brand2:#0da779;--danger:#ff727a;--shadow:0 20px 60px rgba(0,0,0,.26)}
html[data-theme="light"]{--bg:#f4f8f6;--surface:#fff;--surface2:#edf5f1;--line:#d6e6de;--text:#10231b;--muted:#65776f;--brand:#0cb888;--brand2:#07966f;--shadow:0 16px 40px rgba(8,45,31,.10)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(900px 420px at 50% -10%,rgba(32,213,160,.14),transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:active{transform:scale(.985)}
.app{width:min(760px,100%);margin:auto;padding:18px 14px calc(112px + env(safe-area-inset-bottom))}.header{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.brand img{width:58px;height:58px;flex:0 0 58px;border-radius:17px;border:1px solid var(--line)}.brand h1{font-size:24px;margin:0;font-weight:950;letter-spacing:-.03em}.brand p{margin:4px 0 0;color:var(--muted);font-size:10px;letter-spacing:.12em}.header-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.icon{width:100%;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-weight:900}.header-actions .icon{font-size:16px}.header-actions .icon::after{font-size:11px;color:var(--muted)}
.section{display:grid;gap:14px}.hero,.card{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow)}.hero{padding:23px;background:linear-gradient(145deg,var(--surface2),var(--surface))}.eyebrow{margin:0;color:#74cdb5;font-size:11px;font-weight:900;letter-spacing:.12em}.hero h2{margin:6px 0 0;font-size:31px;line-height:1.05}.hero p,.sub{color:var(--muted);line-height:1.65}.calrow{display:flex;align-items:end;gap:8px;margin-top:18px}.cal{font-size:49px;font-weight:950;letter-spacing:-.06em}.unit{color:var(--muted);font-weight:850;margin-bottom:8px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.kpi{padding:12px 7px;text-align:center;border:1px solid var(--line);border-radius:18px;background:rgba(0,0,0,.06)}.kpi b{display:block;font-size:18px}.kpi span{font-size:10px;color:var(--muted)}
.card{padding:18px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.title{margin:0;font-size:20px;font-weight:920}.badge{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid rgba(32,213,160,.25);background:rgba(32,213,160,.08);color:#79dec2;font-size:11px;font-weight:900}
.btn{width:100%;min-height:52px;transition:filter .15s,transform .1s}.btn:disabled{opacity:.55;cursor:wait;filter:saturate(.4)}border-radius:17px;border:1px solid var(--line);padding:13px 16px;font-weight:900}.primary{border:0;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#04140e;box-shadow:0 14px 28px rgba(32,213,160,.18)}.secondary{background:var(--surface2);color:var(--text)}.mini{min-height:74px;display:grid;place-items:center;gap:4px}.mini strong{font-size:20px}

@media(max-width:480px){.app{padding-inline:12px}.brand h1{font-size:22px}.header-actions{gap:7px}.icon{height:46px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}.macro{grid-template-columns:1fr 1fr}.hero h2{font-size:27px}.cal{font-size:42px}}
</style>

let S={page:'home',lang:localStorage.getItem('sm-lang')||'ar',theme:localStorage.getItem('sm-theme')||'dark',query:'',image:'',result:null,voiceText:'',listening:false,log:JSON.parse(localStorage.getItem('sm-log')||'[]')};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), t=k=>T[S.lang][k]??T.ar[k]??k;
const n=x=>Number(x||0).toLocaleString(S.lang==='ar'?'en-US':S.lang==='fr'?'fr-FR':'en-US');
function apply(){document.documentElement.lang=S.lang;document.documentElement.dir=T[S.lang].dir;document.documentElement.dataset.theme=S.theme}
function toast(m,err=false){const e=$('#toast');e.textContent=m;e.style.color=err?'#ffc0c6':'#b8eadb';e.style.borderColor=err?'#6f3038':'#2a6756';e.classList.add('show');clearTimeout(window._toast);window._toast=setTimeout(()=>e.classList.remove('show'),3000)}
function header(){return `<header class="header"><div class="brand"><img src="/smartmeal-icon-192.png" alt="Smart Meal"><div><h1>Smart Meal PRO</h1><p>AI · NUTRITION · PREMIUM</p></div></div><div class="header-actions"><button class="icon" data-a="search">⌕</button><button class="icon" data-a="theme">${S.theme==='dark'?'☀':'☾'}</button><button class="icon" data-a="language">${T[S.lang].short}</button></div></header>`}
function recipeRow(r,i){return `<div class="recipe"><div class="recipe-media">🍽️</div><div><h3>${esc(r[S.lang].name)}</h3><p>${n(r.cal)} ${t('cal')} · ${r.p}P · ${r.c}C · ${r.f}F</p></div><button class="icon" data-a="recipe" data-i="${i}">›</button></div>`}
function home(){const used=S.log.reduce((a,x)=>a+Number(x.cal||0),0);return `<section class="section">${header()}<article class="hero"><p class="eyebrow">${t('today')} · ${t('premium')}</p><h2>${t('summary')}</h2><p>${t('calGoal')}: <b>2,000 ${t('cal')}</b></p><div class="calrow"><div class="cal">${n(Math.max(0,2000-used))}</div><div class="unit">${t('cal')}</div></div><div class="kpis"><div class="kpi"><b>140g</b><span>${t('protein')}</span></div><div class="kpi"><b>220g</b><span>${t('carbs')}</span></div><div class="kpi"><b>70g</b><span>${t('fat')}</span></div><div class="kpi"><b>${n(S.log.length)}</b><span>${t('history')}</span></div></div></article><article class="card"><div class="head"><div><p class="eyebrow">${t('ai')}</p><h2 class="title">${t('ai')}</h2><p class="sub">${t('aiSub')}</p></div><span class="badge">Gemini</span></div><button class="btn primary" data-page="scan" style="margin-top:14px">${t('analyze')} ✦</button></article><article class="card"><div class="head"><div><h2 class="title">${t('recipes')}</h2><p class="sub">${RECIPES.length} ${t('recipes')}</p></div><button class="btn secondary" style="width:auto" data-page="recipes">${t('search')}</button></div><div class="recipe-list">${RECIPES.slice(0,5).map((r,i)=>recipeRow(r,i)).join('')}</div></article></section>`}
function scan(){return `<section class="section">${header()}<article class="card scan"><div class="head"><div><p class="eyebrow">${t('scan')}</p><h2 class="title">${t('ai')}</h2><p class="sub">${t('aiSub')}</p></div></div><div class="grid2"><button class="btn primary" data-a="camera">${t('camera')} 📷</button><button class="btn secondary" data-a="gallery">${t('gallery')} 🖼️</button></div>${S.image?`<div class="preview"><img src="${S.image}" alt="meal"><button class="btn secondary" data-a="clear">${t('clear')}</button></div>`:''}<label class="sub" for="mealText">${t('description')}</label><textarea id="mealText" class="textarea" placeholder="${t('description')}">${esc(S.voiceText)}</textarea><div class="grid2"><button class="btn secondary" data-a="voice">${S.listening?t('voiceStop'):t('voice')} 🎙️</button><button class="btn primary" data-a="analyze">${t('analyze')} ✦</button></div><div class="notice" id="status">${t('voiceUnavailable')}</div>${S.result?result(S.result):''}</article></section>`}
function result(r){const x=r.nutrition||{};return `<div class="result"><div class="head"><div><span class="badge">AI</span><h3>${esc(r.mealName||'Meal')}</h3><p>${esc(r.description||'')}</p></div><button class="icon" data-a="tts">🔊</button></div><div class="macro"><div><b>${n(x.calories)}</b><span>${t('cal')}</span></div><div><b>${n(x.protein)}g</b><span>${t('protein')}</span></div><div><b>${n(x.carbs)}g</b><span>${t('carbs')}</span></div><div><b>${n(x.fat)}g</b><span>${t('fat')}</span></div></div><div style="margin-top:12px"><strong>${t('ingredients')}</strong>${(r.ingredients||[]).map(i=>`<div class="step">${esc(i.name)} — ${esc(i.quantity)}</div>`).join('')}</div><div style="margin-top:12px"><strong>${t('cooking')}</strong>${(r.cookingMethod||[]).map((a,i)=>`<div class="step"><b>${i+1}.</b> ${esc(a)}</div>`).join('')}</div><div style="margin-top:12px"><strong>${t('confidence')}</strong><div class="step">${Math.round(Number(r.confidence||0)*100)}%</div></div><div style="margin-top:12px"><strong>${t('listen')}</strong><button class="btn secondary" data-a="tts" style="margin-top:8px">🔊 ${t('tts')}</button></div><button class="btn primary" data-a="save" style="margin-top:12px">${t('save')}</button></div>`}
function recipes(){const q=S.query.toLowerCase().trim();const list=RECIPES.filter(r=>!q||(r.ar.name+r.fr.name+r.en.name+r.ar.ing.join(' ')+r.fr.ing.join(' ')+r.en.ing.join(' ')).toLowerCase().includes(q));return `<section class="section">${header()}<article class="card"><div class="head"><div><p class="eyebrow">${t('search')}</p><h2 class="title">${t('searchTitle')}</h2></div><span class="badge">${list.length}</span></div><div class="searchbar"><input id="q" value="${esc(S.query)}" placeholder="${t('searchPh')}"><button class="btn primary" data-a="submit-search">⌕</button></div><div class="recipe-list">${list.length?list.map(r=>recipeRow(r,RECIPES.indexOf(r))).join(''):`<div class="empty">${t('searchEmpty')}</div>`}</div></article></section>`}
function history(){return `<section class="section">${header()}<article class="card"><p class="eyebrow">${t('history')}</p><h2 class="title">${t('history')}</h2><div class="recipe-list">${S.log.length?S.log.map(x=>`<div class="recipe"><div class="recipe-media">🥗</div><div><h3>${esc(x.name)}</h3><p>${n(x.cal)} ${t('cal')}</p></div></div>`).join(''):`<div class="empty">${t('historyEmpty')}</div>`}</div></article></section>`}
function more(){return `<section class="section">${header()}<article class="card"><p class="eyebrow">${t('settings')}</p><h2 class="title">${t('settings')}</h2><div class="grid3" style="margin-top:14px"><button class="btn secondary mini" data-a="lang" data-l="ar">العربية</button><button class="btn secondary mini" data-a="lang" data-l="fr">Français</button><button class="btn secondary mini" data-a="lang" data-l="en">English</button></div><button class="btn secondary" data-a="theme" style="margin-top:10px">${S.theme==='dark'?'☀ '+t('light'):'☾ '+t('dark')}</button></article><article class="card"><div class="head"><div><h2 class="title">${t('health')}</h2><p class="sub">${t('backend')}</p></div><button class="btn secondary" style="width:auto" data-a="health">${t('health')}</button></div><div id="health" class="health">—</div></article></section>`}
function nav(){const items=[['home','⌂',t('home')],['scan','✦',t('scan')],['recipes','▣',t('recipes')],['more','☰',t('more')]];$('#nav').innerHTML=items.map(i=>`<button class="${S.page===i[0]?'active':''}" data-page="${i[0]}"><i>${i[1]}</i>${esc(i[2])}</button>`).join('')}
function render(){apply();$('#app').innerHTML=S.page==='home'?home():S.page==='scan'?scan():S.page==='recipes'?recipes():S.page==='history'?history():more();nav();bind()}
function bind(){const q=$('#q');if(q)q.addEventListener('input',e=>{S.query=e.target.value;render();const n=$('#q');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)});}
async function health(){const e=$('#health');if(!e)return;e.textContent='…';try{const r=await fetch('/api/health',{cache:'no-store'});const ct=r.headers.get('content-type')||'';const raw=await r.text();if(!ct.includes('application/json')){e.textContent=`${t('backend')}: HTTP ${r.status}\\n${t('server404')}`;return}const d=JSON.parse(raw);e.textContent=`${t('backend')}: ${d.ok?t('configured'):t('missing')}\\nAI: ${d.aiConfigured?t('configured'):t('missing')}\\n${t('version')}: ${d.version}\\nModel: ${d.model}`}catch(x){e.textContent=`${t('backend')}: ERROR\\n${x.message}`}}
async function analyze(){const text=$('#mealText')?.value.trim()||'';if(!S.image&&!text){toast(t('noInput'),true);return}const b=document.querySelector('[data-a="analyze"]');b.disabled=true;try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:S.image,text,language:S.lang})});const raw=await r.text();let d;try{d=JSON.parse(raw)}catch{throw new Error(`HTTP ${r.status}: ${raw.slice(0,100)}`)}if(!r.ok)throw new Error(d.error||t('aiUnavailable'));S.result=d;render();toast(t('ready'))}catch(x){toast(x.message,true);render()}}
function pick(input){const f=$(input).files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{S.image=rd.result;S.page='scan';render()};rd.readAsDataURL(f)}
async function voice(){
  if(S.listening){try{S.rec?.stop()}catch{};return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(SR){
    try{
      const r=new SR(); r.lang=S.lang==='ar'?'ar-SA':S.lang==='fr'?'fr-FR':'en-US'; r.interimResults=false;
      r.onstart=()=>{S.listening=true;S.rec=r;render()};
      r.onresult=e=>{const text=e.results?.[0]?.[0]?.transcript||'';S.voiceText=(S.voiceText?S.voiceText+' ':'')+text;S.listening=false;S.rec=null;render();toast(t('voiceDone'))};
      r.onerror=()=>{S.listening=false;S.rec=null;render();toast(t('voiceUnavailable'),true);setTimeout(voiceRecord,120)};
      r.onend=()=>{S.listening=false;S.rec=null;render()}; r.start(); return;
    }catch{}
  }
  voiceRecord();
}
async function voiceRecord(){
  try{
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) throw new Error('recording unsupported');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=['audio/ogg;codecs=opus','audio/webm;codecs=opus','audio/webm'];
    const mime=types.find(x=>MediaRecorder.isTypeSupported?.(x))||'';
    const rec=new MediaRecorder(stream,mime?{mimeType:mime}:undefined); const chunks=[];
    rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{
      stream.getTracks().forEach(x=>x.stop()); S.listening=false; render();
      try{
        let blob=new Blob(chunks,{type:rec.mimeType||mime||'audio/webm'});
        if(!/^audio\/(wav|mp3|mpeg|aac|ogg|flac|aiff)/i.test(blob.type)){
          const buf=await blob.arrayBuffer(); const ac=new AudioContext(); const decoded=await ac.decodeAudioData(buf); const src=decoded.getChannelData(0),rate=16000,step=Math.max(1,Math.floor(decoded.sampleRate/rate)),samples=Math.floor(src.length/step),out=new Int16Array(samples);
          for(let i=0,j=0;i<samples;i++,j+=step){const v=Math.max(-1,Math.min(1,src[j]||0));out[i]=v<0?v*32768:v*32767}
          const ab=new ArrayBuffer(44+out.length*2),dv=new DataView(ab),write=(o,str)=>{for(let i=0;i<str.length;i++)dv.setUint8(o+i,str.charCodeAt(i))};
          write(0,'RIFF');dv.setUint32(4,36+out.length*2,true);write(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*2,true);dv.setUint16(32,2,true);dv.setUint16(34,16,true);write(36,'data');dv.setUint32(40,out.length*2,true);for(let i=0;i<out.length;i++)dv.setInt16(44+i*2,out[i],true); blob=new Blob([ab],{type:'audio/wav'});
        }
        const b64=await toData(blob); const r=await fetch('/api/voice',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({audio:b64,language:S.lang})}); const raw=await r.text(); let d; try{d=JSON.parse(raw)}catch{throw new Error(`HTTP ${r.status}`)} if(!r.ok)throw new Error(d.error||t('voiceError'));
        S.voiceText=(S.voiceText?S.voiceText+' ':'')+(d.text||''); render(); toast(t('voiceDone'));
      }catch(x){toast(x.message||t('voiceError'),true);render()}
    };
    S.rec=rec;S.listening=true;render();rec.start();setTimeout(()=>{if(S.listening)try{rec.stop()}catch{}},12000);
  }catch{toast(t('voiceError'),true);S.listening=false;render()}
}

function toData(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)})}
async function tts(){if(!S.result)return;const text=`${S.result.mealName}. ${S.result.description}. ${S.result.nutrition?.calories||0} ${t('cal')}.`;try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,language:S.lang})});const d=await r.json();if(!r.ok)throw new Error(d.error);const url=URL.createObjectURL(new Blob([Uint8Array.from(atob(d.audioBase64),c=>c.charCodeAt(0))],{type:d.mimeType||'audio/wav'}));const a=new Audio(url);a.onended=()=>URL.revokeObjectURL(url);await a.play()}catch{if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=S.lang==='ar'?'ar-SA':S.lang==='fr'?'fr-FR':'en-US';speechSynthesis.speak(u)}}}
function showRecipe(i){const r=RECIPES[i],d=r[S.lang];$('#sheet').innerHTML=`<div class="sheettop"><div><p class="eyebrow">${t('details')}</p><h2 class="title">${esc(d.name)}</h2></div><button class="close" data-a="close">×</button></div><div class="recipe" style="margin-top:12px"><div class="recipe-media">🍽️</div><div><h3>${esc(d.name)}</h3><p>${n(r.cal)} ${t('cal')} · ${r.p}P · ${r.c}C · ${r.f}F</p></div></div><div style="margin-top:12px"><strong>${t('ingredients')}</strong>${d.ing.map(x=>`<div class="step">${esc(x)}</div>`).join('')}</div><div style="margin-top:12px"><strong>${t('steps')}</strong>${d.steps.map((x,j)=>`<div class="step"><b>${j+1}.</b> ${esc(x)}</div>`).join('')}</div><button class="btn primary" data-a="addrecipe" data-i="${i}" style="margin-top:12px">${t('add')}</button>`;$('#sheetback').classList.add('show')}
function closeSheet(){$('#sheetback').classList.remove('show')}
function language(){showLang()}
function showLang(){$('#sheet').innerHTML=`<div class="sheettop"><div><p class="eyebrow">${t('language')}</p><h2 class="title">${t('language')}</h2></div><button class="close" data-a="close">×</button></div><div class="grid3" style="margin-top:14px"><button class="btn secondary mini" data-a="lang" data-l="ar">العربية</button><button class="btn secondary mini" data-a="lang" data-l="fr">Français</button><button class="btn secondary mini" data-a="lang" data-l="en">English</button></div>`;$('#sheetback').classList.add('show')}
document.addEventListener('click',e=>{const p=e.target.closest('[data-page]');if(p){S.page=p.dataset.page;render();return}const b=e.target.closest('[data-a]');if(!b)return;switch(b.dataset.a){case'theme':S.theme=S.theme==='dark'?'light':'dark';localStorage.setItem('sm-theme',S.theme);render();break;case'language':language();break;case'lang':S.lang=b.dataset.l;localStorage.setItem('sm-lang',S.lang);closeSheet();render();break;case'search':S.page='recipes';render();setTimeout(()=>$('#q')?.focus(),50);break;case'camera':$('#camera').click();break;case'gallery':$('#gallery').click();break;case'voice':voice();break;case'analyze':analyze();break;case'health':health();break;case'recipe':showRecipe(+b.dataset.i);break;case'close':closeSheet();break;case'addrecipe':{const r=RECIPES[+b.dataset.i];S.log.unshift({name:r[S.lang].name,cal:r.cal,time:Date.now()});localStorage.setItem('sm-log',JSON.stringify(S.log));closeSheet();toast(t('added'));break}case'tts':tts();break;case'save':{const r=S.result;S.log.unshift({name:r.mealName,cal:r.nutrition?.calories||0,time:Date.now()});localStorage.setItem('sm-log',JSON.stringify(S.log));toast(t('added'));break}case'clear':S.image='';render();break;case'submit-search':S.query=$('#q')?.value||'';render();break}});
$('#camera').addEventListener('change',e=>pick('#camera'));$('#gallery').addEventListener('change',e=>pick('#gallery'));$('#sheetback').addEventListener('click',e=>{if(e.target.id==='sheetback')closeSheet()});
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{});}
