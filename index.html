<!doctype html>
<html lang="ar" dir="rtl" data-lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071713">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/smartmeal-icon-192.png">
<title>Smart Meal — وجبتي الذكية</title>
<style>
:root{--bg:#06110e;--card:#0d1b17;--card2:#11231e;--line:#234037;--text:#f5faf7;--muted:#94aaa2;--brand:#18c892;--brand2:#0ea67a;--danger:#ef6b73;--shadow:0 18px 50px rgba(0,0,0,.26)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:linear-gradient(180deg,#06110e,#071713 45%,#06110e);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{outline:none;color:var(--text);background:#091612;border:1px solid var(--line);border-radius:16px;padding:13px 14px;width:100%}
textarea{resize:vertical;min-height:110px}
button:active{transform:scale(.985)}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:52px;height:52px;border-radius:16px;object-fit:cover;box-shadow:0 10px 32px rgba(24,200,146,.25)}
.brand h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.03em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:11px;letter-spacing:.09em}
.icon-btn{width:48px;height:48px;border-radius:16px;background:#0c1b17;border:1px solid var(--line);color:var(--text);display:grid;place-items:center;font-size:20px}
.lang-btn{font-size:15px;font-weight:800}
.grid{display:grid;gap:14px}
.card{background:linear-gradient(180deg,rgba(17,35,30,.94),rgba(9,22,18,.98));border:1px solid var(--line);border-radius:26px;padding:18px;box-shadow:var(--shadow)}
.hero{padding:22px;background:radial-gradient(circle at 90% 0,rgba(24,200,146,.20),transparent 42%),linear-gradient(145deg,#0f2a21,#0a1714)}
.section-title{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700}
.big{font-size:36px;font-weight:950;letter-spacing:-.04em}
.muted{color:var(--muted)}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:15px}
.kpi{background:#0a1714;border:1px solid var(--line);padding:11px;border-radius:16px;text-align:center}
.kpi b{display:block;font-size:18px}.kpi span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#04150f;font-weight:950;padding:14px 16px;border-radius:18px;width:100%;box-shadow:0 16px 34px rgba(24,200,146,.18)}
.secondary{background:#0b1815;color:var(--text);border:1px solid var(--line);font-weight:850;padding:13px 15px;border-radius:18px;width:100%}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.result{margin-top:14px;border:1px solid #29604f;background:#0a1714;padding:14px;border-radius:20px}
.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.result-grid div{background:#0f221d;border:1px solid var(--line);padding:10px;border-radius:14px;text-align:center}
.result-grid b{font-size:16px}.result-grid span{font-size:10px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:#0a1a15;border:1px solid var(--line);color:#a7c2b7;font-size:11px;font-weight:800}
.status{font-family:ui-monospace,monospace;font-size:12px;line-height:1.8;white-space:pre-line;background:#07110e;border:1px dashed var(--line);padding:12px;border-radius:16px;color:#9fbaaf;min-height:46px}
.recipe{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);background:#0a1714;border-radius:18px}
.recipe .emoji{width:54px;height:54px;border-radius:16px;background:#132a22;display:grid;place-items:center;font-size:26px}
.recipe h3{margin:0;font-size:14px}.recipe p{margin:4px 0 0;color:var(--muted);font-size:11px}
.search-row{display:grid;grid-template-columns:1fr auto;gap:8px}
.nav{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(560px,calc(100% - 20px));background:rgba(7,18,14,.94);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:24px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);z-index:30}
.nav button{background:transparent;color:var(--muted);padding:10px 6px;border-radius:16px;font-weight:800;font-size:11px}.nav button.active{background:#0c2a20;color:#59e0ba}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(560px,100%);max-height:88vh;overflow:auto;background:#091713;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:18px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.close{background:#0d211b;color:var(--text);border:1px solid var(--line);border-radius:14px;width:42px;height:42px}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:16px;background:#1c1910;border:1px solid #5d5123;color:#e6d99a;font-size:12px;line-height:1.6}
.ok{background:#0a1e18;border-color:#1b604b;color:#97ddc7}.err{background:#251313;border-color:#6a2a2f;color:#ffb5bb}
@media (max-width:420px){.brand h1{font-size:20px}.topbar{grid-template-columns:auto 1fr auto}.kpi-grid{gap:6px}.kpi{padding:9px}.kpi b{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<input id="cameraInput" class="hidden" type="file" accept="image/*" capture="environment">
<input id="galleryInput" class="hidden" type="file" accept="image/*">
<nav class="nav" id="nav"></nav>
<script>
'use strict';
const LANG={ar:{dir:'rtl',name:'العربية',short:'AR',nav:['الرئيسية','الماسح','الوصفات','المزيد'],search:'بحث',home:'ملخص يومك',scan:'تحليل الوجبة بالذكاء الاصطناعي',recipes:'اكتشف الوصفات',settings:'الإعدادات',camera:'الكاميرا',gallery:'المعرض',voice:'تحدث عن وجبتك',analyze:'حلّل الوجبة',searchPh:'ابحث عن وصفة أو مكوّن',today:'اليوم',cal:'سعرة',p:'بروتين',c:'كربوهيدرات',f:'دهون',system:'فحص النظام',loading:'جاري التحليل…',aiMissing:'الذكاء الاصطناعي يحتاج إلى GEMINI_API_KEY في Vercel.',voiceListening:'أستمع الآن… تكلم بوضوح.',voiceDone:'تم إدخال كلامك.',voiceFail:'تعذر تشغيل الإدخال الصوتي على هذا الجهاز.',noImage:'اختر صورة أولًا.',ai:'الذكاء الاصطناعي',history:'السجل',add:'إضافة للسجل',close:'إغلاق',theme:'الوضع'},en:{dir:'ltr',name:'English',short:'EN',nav:['Home','Scanner','Recipes','More'],search:'Search',home:'Your day at a glance',scan:'AI meal analysis',recipes:'Explore recipes',settings:'Settings',camera:'Camera',gallery:'Gallery',voice:'Talk about your meal',analyze:'Analyze meal',searchPh:'Search recipe or ingredient',today:'Today',cal:'kcal',p:'Protein',c:'Carbs',f:'Fat',system:'System check',loading:'Analyzing…',aiMissing:'AI needs GEMINI_API_KEY in Vercel.',voiceListening:'Listening… speak clearly.',voiceDone:'Your speech was added.',voiceFail:'Voice input is not available on this device.',noImage:'Choose an image first.',ai:'AI',history:'History',add:'Add to log',close:'Close',theme:'Theme'},fr:{dir:'ltr',name:'Français',short:'FR',nav:['Accueil','Scanner','Recettes','Plus'],search:'Rechercher',home:'Votre journée en un coup d’œil',scan:'Analyse IA du repas',recipes:'Découvrir les recettes',settings:'Paramètres',camera:'Caméra',gallery:'Galerie',voice:'Parlez de votre repas',analyze:'Analyser le repas',searchPh:'Rechercher une recette ou un ingrédient',today:'Aujourd’hui',cal:'kcal',p:'Protéines',c:'Glucides',f:'Lipides',system:'État du système',loading:'Analyse…',aiMissing:'L’IA nécessite GEMINI_API_KEY dans Vercel.',voiceListening:'J’écoute… parlez clairement.',voiceDone:'Votre parole a été ajoutée.',voiceFail:'La saisie vocale n’est pas disponible sur cet appareil.',noImage:'Choisissez une image.',ai:'IA',history:'Historique',add:'Ajouter au journal',close:'Fermer',theme:'Thème'}};
const RECIPES=[
 {name:{ar:'دجاج مشوي مع أرز',en:'Grilled chicken & rice',fr:'Poulet grillé & riz'},cat:'chicken',emoji:'🍗',cal:620,p:48,c:58,f:18,ings:{ar:'دجاج، أرز، خضار',en:'Chicken, rice, vegetables',fr:'Poulet, riz, légumes'}},
 {name:{ar:'سلطة تونة متوسطية',en:'Mediterranean tuna salad',fr:'Salade de thon méditerranéenne'},cat:'fish',emoji:'🥗',cal:390,p:36,c:24,f:15,ings:{ar:'تونة، طماطم، زيت زيتون',en:'Tuna, tomato, olive oil',fr:'Thon, tomate, huile d’olive'}},
 {name:{ar:'شوفان بالموز',en:'Banana oats',fr:'Avoine à la banane'},cat:'breakfast',emoji:'🥣',cal:340,p:14,c:55,f:9,ings:{ar:'شوفان، موز، حليب',en:'Oats, banana, milk',fr:'Avoine, banane, lait'}},
 {name:{ar:'بيض وأفوكادو',en:'Eggs & avocado',fr:'Œufs & avocat'},cat:'breakfast',emoji:'🥑',cal:430,p:21,c:14,f:31,ings:{ar:'بيض، أفوكادو، خبز',en:'Eggs, avocado, bread',fr:'Œufs, avocat, pain'}}
];
const state={lang:localStorage.getItem('sm_final_lang')||'ar',tab:'home',q:'',img:null,lastAI:null,voice:null,profile:{cal:2000,p:140,c:220,f:70},log:[]};
const t=k=>LANG[state.lang]?.[k]??LANG.ar[k]??k;
const fmt=n=>new Intl.NumberFormat('en-US').format(Math.round(Number(n)||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const $=s=>document.querySelector(s);
function setLang(l){state.lang=l;localStorage.setItem('sm_final_lang',l);document.documentElement.lang=l;document.documentElement.dir=LANG[l].dir;render();}
function showModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
function topbar(){return `<header class="topbar"><button class="icon-btn lang-btn" data-action="language">${t('search')}</button><div class="brand"><img src="/smartmeal-icon-192.png"><div><h1>Smart Meal</h1><p>AI NUTRITION • PREMIUM</p></div></div><div style="display:flex;gap:8px"><button class="icon-btn" data-action="search" aria-label="${t('search')}">⌕</button><button class="icon-btn" data-action="theme" aria-label="${t('theme')}">☼</button><button class="icon-btn lang-btn" data-action="language">${LANG[state.lang].short}</button></div></header>`}
function nav(){const tabs=['home','scan','recipes','settings'];$('#nav').innerHTML=tabs.map((x,i)=>`<button class="${state.tab===x?'active':''}" data-action="tab" data-tab="${x}">${['⌂','✦','▣','☰'][i]}<br>${t('nav')[i]}</button>`).join('')}
function renderHome(){const consumed=state.log.reduce((a,x)=>a+x.cal,0);const remain=Math.max(0,state.profile.cal-consumed);return `<div class="wrap">${topbar()}<section class="card hero"><p class="section-title">${t('today')}</p><div class="big"><span class="num">${fmt(remain)}</span> ${t('cal')}</div><div class="muted">${t('home')}</div><div class="kpi-grid"><div class="kpi"><b>${fmt(state.profile.p)}</b><span>${t('p')}</span></div><div class="kpi"><b>${fmt(state.profile.c)}</b><span>${t('c')}</span></div><div class="kpi"><b>${fmt(state.profile.f)}</b><span>${t('f')}</span></div><div class="kpi"><b>${fmt(consumed)}</b><span>${t('cal')}</span></div></div></section><section class="card"><div class="row"><div><p class="section-title">${t('scan')}</p><h2 style="margin:0">${t('ai')}</h2></div><span class="badge">● Gemini</span></div><p class="muted" style="line-height:1.65">${state.lang==='ar'?'صوّر وجبتك أو تحدث عنها، وسيقدّر الذكاء الاصطناعي المكونات والسعرات والماكروز.':state.lang==='fr'?'Photographiez votre repas ou parlez-en pour obtenir une estimation des calories et macros.':'Take a photo or describe your meal to estimate calories and macros.'}</p><button class="primary" data-action="tab" data-tab="scan">✦ ${t('analyze')}</button></section><section class="card"><div class="row"><h2 style="margin:0">${t('recipes')}</h2><button class="icon-btn" data-action="search">⌕</button></div><div class="grid" style="margin-top:12px">${RECIPES.slice(0,3).map(recipeHtml).join('')}</div></section></div>`}
function recipeHtml(r){return `<article class="recipe"><div class="emoji">${r.emoji}</div><div><h3>${esc(r.name[state.lang])}</h3><p>${fmt(r.cal)} ${t('cal')} • ${fmt(r.p)}P • ${fmt(r.c)}C • ${fmt(r.f)}F</p></div><button class="icon-btn" style="width:40px;height:40px" data-action="add-recipe" data-i="${RECIPES.indexOf(r)}">+</button></article>`}
function renderScan(){const result=state.lastAI;return `<div class="wrap">${topbar()}<section class="card"><p class="section-title">${t('scan')}</p><h2 style="margin:0 0 10px">${t('ai')}</h2><div class="three"><label class="secondary" style="display:grid;place-items:center"><span style="font-size:20px">📷</span>${t('camera')}<input id="cam" type="file" accept="image/*" capture="environment" class="hidden"></label><label class="secondary" style="display:grid;place-items:center"><span style="font-size:20px">🖼️</span>${t('gallery')}<input id="gal" type="file" accept="image/*" class="hidden"></label><button class="secondary" data-action="voice"><span style="font-size:20px">🎙️</span>${t('voice')}</button></div>${state.img?`<img src="${state.img}" alt="meal" style="width:100%;max-height:260px;object-fit:cover;border-radius:18px;margin-top:12px;border:1px solid var(--line)">`:''}<textarea id="desc" style="margin-top:12px" placeholder="${esc(t('searchPh'))}"></textarea><button class="primary" data-action="analyze" style="margin-top:12px">✦ ${t('analyze')}</button><div id="aiNotice" class="notice hidden" style="margin-top:12px"></div>${result?resultHtml(result):''}</section><section class="card"><div class="row"><h2 style="margin:0">${t('system')}</h2><button class="secondary" style="width:auto" data-action="health">${t('system')}</button></div><div id="health" class="status" style="margin-top:12px"></div></section></div>`}
function resultHtml(r){const n=r.nutrition||{};return `<div class="result"><div class="row"><div><div class="badge">${t('ai')}</div><h3 style="margin:10px 0 2px">${esc(r.mealName||'Meal')}</h3><div class="muted" style="font-size:12px">${esc(r.description||'')}</div></div><button class="icon-btn" style="width:40px;height:40px" data-action="speak" aria-label="speak">🔊</button></div><div class="result-grid"><div><b>${fmt(n.calories)}</b><span>${t('cal')}</span></div><div><b>${fmt(n.protein)}</b><span>${t('p')}</span></div><div><b>${fmt(n.carbs)}</b><span>${t('c')}</span></div><div><b>${fmt(n.fat)}</b><span>${t('f')}</span></div></div><button class="primary" style="margin-top:12px" data-action="add-ai">${t('add')}</button></div>`}
function renderRecipes(){let list=RECIPES;const q=state.q.trim().toLowerCase();if(q)list=list.filter(r=>(r.name[state.lang]+' '+r.ings[state.lang]).toLowerCase().includes(q));return `<div class="wrap">${topbar()}<section class="card"><div class="row"><div><p class="section-title">${t('recipes')}</p><h2 style="margin:0">${t('search')}</h2></div><button class="close" data-action="clear-search">×</button></div><div class="search-row" style="margin-top:12px"><input id="q" value="${esc(state.q)}" placeholder="${esc(t('searchPh'))}"><button class="primary" style="width:auto;padding:0 18px" data-action="do-search">⌕</button></div><div class="grid" style="margin-top:14px">${list.length?list.map(recipeHtml).join(''):`<div class="muted">No results</div>`}</div></section></div>`}
function renderSettings(){return `<div class="wrap">${topbar()}<section class="card"><h2 style="margin-top:0">${t('settings')}</h2><div class="three"><button class="secondary" data-action="setlang" data-l="ar">العربية</button><button class="secondary" data-action="setlang" data-l="fr">Français</button><button class="secondary" data-action="setlang" data-l="en">English</button></div><button class="primary" data-action="health" style="margin-top:14px">${t('system')}</button><div id="health" class="status" style="margin-top:12px"></div></section></div>`}
function render(){document.documentElement.dir=LANG[state.lang].dir;document.documentElement.lang=state.lang;let html=state.tab==='home'?renderHome():state.tab==='scan'?renderScan():state.tab==='recipes'?renderRecipes():renderSettings();$('#app').innerHTML=html;nav();bindInputs();}
function bindInputs(){const q=$('#q');if(q)q.addEventListener('input',e=>{state.q=e.target.value;renderRecipes();const n=$('#q');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)});for(const id of ['cam','gal']){const el=$('#'+id);if(el)el.addEventListener('change',e=>fileSelected(e.target.files?.[0]));}}
async function fileSelected(file){if(!file)return;if(!file.type.startsWith('image/'))return notify('Not an image',true);const reader=new FileReader();reader.onload=()=>{state.img=reader.result;render()};reader.readAsDataURL(file)}
function notify(msg,error=false){const n=$('#aiNotice');if(n){n.textContent=msg;n.classList.remove('hidden','err','ok');n.classList.add(error?'err':'ok');}else alert(msg)}
async function analyze(){if(!state.img){notify(t('noImage'),true);return}notify(t('loading'));try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:state.img,text:$('#desc')?.value||'',language:state.lang})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI unavailable');state.lastAI=d;render()}catch(e){notify(e.message.includes('GEMINI_API_KEY')?t('aiMissing'):e.message,true)}}
async function health(){const el=$('#health');if(!el)return;el.textContent='Checking…';try{const r=await fetch('/api/health',{cache:'no-store'});const ct=r.headers.get('content-type')||'';const raw=await r.text();if(!ct.includes('application/json')){el.textContent=`Backend: ERROR\nThe deployment is not serving /api/health (HTTP ${r.status}).\nVercel Root Directory must be the repository root.`;el.className='status err';return}const d=JSON.parse(raw);el.textContent=`Backend: ${d.ok?'OK':'ERROR'}\nAI: ${d.aiConfigured?'Configured':'Missing GEMINI_API_KEY'}\nModel: ${d.model||'-'}\nVersion: ${d.version||'-'}`;el.className='status '+(d.ok?'ok':'err')}catch(e){el.textContent='Backend: ERROR\n'+e.message;el.className='status err'}}
function speak(text){if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=state.lang==='ar'?'ar-DZ':state.lang==='fr'?'fr-FR':'en-US';speechSynthesis.speak(u);return true}return false}
async function voice(){if(state.voice){try{state.voice.stop()}catch{};state.voice=null;return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){notify(t('voiceFail'),true);return}try{const r=new SR();r.lang=state.lang==='ar'?'ar-DZ':state.lang==='fr'?'fr-FR':'en-US';r.continuous=false;r.interimResults=false;r.onstart=()=>notify(t('voiceListening'));r.onresult=e=>{$('#desc').value=(($('#desc').value||'')+' '+e.results[0][0].transcript).trim();notify(t('voiceDone'))};r.onerror=()=>notify(t('voiceFail'),true);r.onend=()=>{state.voice=null};state.voice=r;r.start()}catch(e){notify(t('voiceFail'),true)}}
async function searchOpen(){state.tab='recipes';state.q='';render();setTimeout(()=>$('#q')?.focus(),100)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='tab'){state.tab=b.dataset.tab;render()}else if(a==='language'){showModal(`<div class="row"><h3>${t('settings')}</h3><button class="close" data-action="close">×</button></div><div class="three" style="margin-top:14px"><button class="secondary" data-action="setlang" data-l="ar">العربية</button><button class="secondary" data-action="setlang" data-l="fr">Français</button><button class="secondary" data-action="setlang" data-l="en">English</button></div>`)}else if(a==='setlang'){setLang(b.dataset.l);closeModal()}else if(a==='theme'){document.documentElement.classList.toggle('dark');}else if(a==='search'){searchOpen()}else if(a==='close'){closeModal()}else if(a==='clear-search'){state.q='';renderRecipes()}else if(a==='do-search'){state.q=$('#q')?.value||'';renderRecipes()}else if(a==='voice'){voice()}else if(a==='analyze'){analyze()}else if(a==='speak'){speak(`${state.lastAI?.mealName||''}. ${state.lastAI?.description||''}`)}else if(a==='health'){health()}else if(a==='add-ai'){const n=state.lastAI?.nutrition||{};state.log.push({cal:n.calories||0});notify('Added ✓')}else if(a==='add-recipe'){const r=RECIPES[Number(b.dataset.i)];if(r){state.log.push({cal:r.cal});notify('Added ✓')}}});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
render();
</script>
</body></html>
