   <div class="feature-banner panel"><div><div class="eyebrow">${lang==='ar'?'وصفة مقترحة':'RECOMMENDED'}</div><h2 style="margin:6px 0">${esc(name(featured[0]))}</h2><p class="muted">${esc((steps(featured[0])||[])[0]||'')}</p><div class="recipe-badges"><span class="badge">${featured[0].cal} ${tr('calories')}</span><span class="badge">${featured[0].p}g ${tr('protein')}</span><span class="badge">${featured[0].prep} ${tr('prep')}</span></div><button class="btn primary" data-open="${featured[0].id}" style="margin-top:12px">${tr('details')} →</button></div><div class="big-emoji">${featured[0].emoji}</div></div>
   <div class="recipe-grid" style="margin-top:12px">${popular.map(card).join('')}</div>
 </div>`;
 $('#goAnalyze').onclick=()=>show('analyze');$('#goRecipes').onclick=()=>show('recipes');$('#qa').onclick=()=>show('analyze');$('#qr').onclick=()=>show('recipes');$('#qm').onclick=()=>show('more');$('#goPlanner').onclick=()=>show('more');$('#seeAll').onclick=()=>show('recipes');bindCards();
}
function card(r){return `<article class="recipe"><div class="recipe-top"><div class="emoji">${r.emoji}</div><button class="fav" data-fav="${r.id}" aria-label="favorite">${fav.has(r.id)?'♥':'♡'}</button></div><h3>${esc(name(r))}</h3><div class="meta">${r.cal} ${tr('calories')} · ${r.p}g ${tr('protein')} · ${r.prep} ${tr('prep')} · ${r.servings} ${tr('servings')}</div><div class="recipe-badges"><span class="badge">${tr(r.category==='vegetarian'?'veg':r.category)}</span><span class="badge">${r.ingredients.length} ${lang==='ar'?'مكونات':'ingredients'}</span></div><button class="btn" data-open="${r.id}" style="width:100%;margin-top:10px">${tr('details')} · ${lang==='ar'?'طريقة الطبخ':'How to cook'}</button></article>`}
function bindCards(){$$('[data-open]').forEach(b=>b.onclick=()=>detail(b.dataset.open));$$('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();const id=b.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem('sm-fav',JSON.stringify([...fav]));render()})}
function recipes(){const filtered=R.filter(r=>(cat==='all'||r.category===cat||(cat==='highProtein'&&r.p>=30)||(cat==='veg'&&r.category==='vegetarian'))&&(!query||((name(r)+' '+ing(r).join(' ')).toLowerCase().includes(query.toLowerCase()))));$('#recipes').innerHTML=`<div class="panel"><div class="eyebrow">${tr('recipes')}</div><h2 style="margin:0 0 12px">${R.length} ${tr('recipes')}</h2><div class="search"><input id="rq" class="field" value="${esc(query)}" placeholder="${tr('searchPh')}"><button class="btn primary" id="clearQ">×</button></div><div class="chips">${['all','breakfast','lunch','dinner','snack','veg','highProtein'].map(c=>`<button class="chip ${cat===c?'active':''}" data-cat="${c}">${tr(c)}</button>`).join('')}</div></div><div class="recipe-grid" style="margin-top:12px">${filtered.length?filtered.map(card).join(''):`<div class="empty" style="grid-column:1/-1">${tr('empty')}</div>`}</div>`;$('#rq').oninput=e=>{query=e.target.value;recipes();setTimeout(()=>$('#rq')?.focus(),0)};$('#clearQ').onclick=()=>{query='';recipes()};$$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;recipes()});bindCards()}
function detail(id){const r=R.find(x=>x.id===id);if(!r)return;$('#modal').classList.add('show');const ingredientRows=r.ingredients.map(([k,q])=>`<div class="list-item ingredient-row"><b>${esc(ING[k]?.[lang]||ING[k]?.en||k)}</b><span class="ingredient-qty">${esc(q)}</span></div>`).join('');$('#sheet').innerHTML=`<div class="sheet-head"><div><div class="eyebrow">${tr('recipes')} · ${tr(r.category==='vegetarian'?'veg':r.category)}</div><h2>${esc(name(r))}</h2><div class="meta">${r.cal} ${tr('calories')} · ${r.p}g ${tr('protein')} · ${r.c}g ${tr('carbs')} · ${r.f}g ${tr('fat')} · ${r.prep} ${tr('prep')} · ${r.servings} ${tr('servings')}</div><div class="meta" style="margin-top:6px">${lang==='ar'?'القيم الغذائية تقديرية وقد تختلف حسب الكمية والعلامة التجارية.':'Nutrition values are estimates and can vary by portion and ingredients.'}</div></div><button class="close" id="close">×</button></div><div class="panel" style="margin-top:16px;background:linear-gradient(135deg,rgba(35,214,163,.08),transparent),var(--surface2)"><div class="eyebrow">${lang==='ar'?'قبل أن تبدأ':'BEFORE YOU START'}</div><p class="muted" style="margin:6px 0 0">${lang==='ar'?'المقادير أدناه هي نفس المقادير المستخدمة في خطوات التحضير. اتبع الترتيب ولا تضف مكونات غير مذكورة.':'The ingredients below are the exact ingredients used by the cooking steps. Follow the order and do not add unlisted items.'}</p></div><div class="section-title"><h3>${tr('ingredients')}</h3><span class="badge">${r.ingredients.length}</span></div><div class="list">${ingredientRows}</div><div class="section-title"><h3>${tr('method')}</h3><span class="badge">${steps(r).length} ${lang==='ar'?'خطوات':'steps'}</span></div><div class="list">${steps(r).map((x,i)=>`<div class="list-item method-step"><span class="num">${i+1}</span>${esc(x)}</div>`).join('')}</div><div class="modal-actions actions" style="margin-top:14px"><button class="btn primary" id="saveR">${tr('saveMeal')}</button><button class="btn" id="shopR">🛒 ${tr('addShopping')}</button><button class="btn" id="favR">${fav.has(r.id)?'♥':'♡'} ${tr('favorite')}</button></div>`;$('#close').onclick=()=>$('#modal').classList.remove('show');$('#saveR').onclick=()=>{hist.unshift({name:name(r),cal:r.cal,time:Date.now()});localStorage.setItem('sm-history',JSON.stringify(hist));toast(tr('saved'));$('#modal').classList.remove('show');};$('#shopR').onclick=()=>{r.ingredients.forEach(([k,q])=>shop.add(`${q} — ${ING[k]?.[lang]||ING[k]?.en||k}`));localStorage.setItem('sm-shop',JSON.stringify([...shop]));toast(tr('added'));};$('#favR').onclick=()=>{fav.has(r.id)?fav.delete(r.id):fav.add(r.id);localStorage.setItem('sm-fav',JSON.stringify([...fav]));detail(id)}}
async function analyzeMeal(){const text=$('#mealText').value.trim();if(!image&&!text){toast(tr('noImage'),true);return}const b=$('#analyzeBtn');b.disabled=true;b.textContent=tr('analyzing');try{const r=await fetch('/api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang,text,image})});const d=await r.json().catch(()=>({error:'Backend returned an invalid response.'}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);analysis=d;showResult()}catch(e){toast(e.message||tr('error'),true)}finally{b.disabled=false;b.textContent=tr('analyzeMeal')}}
function analyze(){ $('#analyze').innerHTML=`<div class="panel"><div class="eyebrow">${tr('analyze')}</div><h2 style="margin:0">${tr('analyzeMeal')}</h2><p class="muted">${tr('mealDesc')}</p><div class="actions"><button class="btn primary" id="cam">📷 ${tr('camera')}</button><button class="btn" id="gal">🖼 ${tr('gallery')}</button></div><input id="mealText" class="textarea" style="margin-top:10px" placeholder="${tr('mealPh')}"><div id="preview"></div><button class="btn gold" id="analyzeBtn" style="width:100%;margin-top:10px">✦ ${tr('analyzeMeal')}</button><div id="result"></div></div>`;$('#cam').onclick=()=>$('#camera').click();$('#gal').onclick=()=>$('#gallery').click();$('#analyzeBtn').onclick=analyzeMeal;if(image)showPreview();if(analysis)showResult()}
function showPreview(){if(!image)return;$('#preview').innerHTML=`<img src="${image}" alt="Meal preview" style="width:100%;margin-top:10px;border-radius:18px;max-height:360px;object-fit:cover;border:1px solid var(--line)">`}
function showResult(){const d=analysis;if(!d)return;$('#result').innerHTML=`<div class="result"><div class="panel"><div class="eyebrow">${tr('nutrition')}</div><h3 style="margin:0">${esc(d.mealName||'')}</h3><p class="muted">${esc(d.summary||'')}</p><div class="result-grid"><div class="stat"><b>${Math.round(d.nutrition?.calories||0)}</b><span>${tr('calories')}</span></div><div class="stat"><b>${Math.round(d.nutrition?.protein||0)}g</b><span>${tr('protein')}</span></div><div class="stat"><b>${Math.round(d.nutrition?.carbs||0)}g</b><span>${tr('carbs')}</span></div><div class="stat"><b>${Math.round(d.nutrition?.fat||0)}g</b><span>${tr('fat')}</span></div></div><div class="section-title"><h3>${tr('ingredients')}</h3></div><div class="list">${(d.ingredients||[]).map(x=>`<div class="list-item">• ${esc(x)}</div>`).join('')}</div><div class="section-title"><h3>${tr('method')}</h3></div><div class="list">${(d.cookingMethod||[]).map((x,i)=>`<div class="list-item">${i+1}. ${esc(x)}</div>`).join('')}</div><div class="section-title"><h3>AI</h3></div><div class="list">${(d.advice||[]).map(x=>`<div class="list-item">• ${esc(x)}</div>`).join('')}</div><button class="btn primary" id="saveAI" style="width:100%;margin-top:10px">${tr('saveMeal')}</button></div></div>`;$('#saveAI').onclick=()=>{hist.unshift({name:d.mealName||'Meal',cal:Math.round(d.nutrition?.calories||0),time:Date.now()});localStorage.setItem('sm-history',JSON.stringify(hist));toast(tr('saved'))}}
async function health(){const box=$('#healthBox');box.textContent='…';try{const r=await fetch('/api/health',{cache:'no-store'});const t=await r.text();if(!r.ok)throw new Error(`HTTP ${r.status}: ${t.slice(0,120)}`);const d=JSON.parse(t);box.innerHTML=`<div class="status"><span><span class="dot ${d.ok?'ok':''}" style="display:inline-block;margin-inline-end:7px"></span>${tr('system')}</span><b>${d.ok?tr('serverOnline'):tr('serverDown')}</b></div><div class="status" style="margin-top:8px"><span>AI</span><b>${d.aiConfigured?tr('aiReady'):tr('aiMissing')}</b></div>`}catch(e){box.innerHTML=`<div class="status"><span>${esc(e.message)}</span><b style="color:var(--danger)">${tr('error')}</b></div>`}}
async function planner(){const box=$('#planResult');const btn=$('#planBtn');btn.disabled=true;btn.textContent='…';try{const r=await fetch('/api/coach',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:lang,goal:$('#goal').value,calories:Number($('#daily').value||2200),preferences:$('#prefs').value.trim()})});const d=await r.json().catch(()=>({error:'Invalid backend response'}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);box.innerHTML=`<div class="panel"><h3>${esc(d.title||'')}</h3><p class="muted">${esc(d.summary||'')}</p>${(d.days||[]).map(day=>`<div class="section-title"><h3>${esc(day.day)}</h3></div>${(day.meals||[]).map(m=>`<div class="list-item"><b>${esc(m.time)} · ${esc(m.name)}</b><div class="meta">${m.calories} ${tr('calories')} · ${m.protein}g ${tr('protein')}</div><div>${esc(m.description)}</div></div>`).join('')}`).join('')}</div>`}catch(e){toast(e.message,true)}finally{btn.disabled=false;btn.textContent=tr('generate')}}
function more(){const history=hist.slice(0,12);$('#more').innerHTML=`<div class="grid3"><div class="panel"><div class="eyebrow">${tr('favorite')}</div><h2>${fav.size}</h2></div><div class="panel"><div class="eyebrow">${tr('shopping')}</div><h2>${shop.size}</h2></div><div class="panel"><div class="eyebrow">${tr('history')}</div><h2>${hist.length}</h2></div></div><div class="panel" style="margin-top:12px"><div class="section-title"><h2>${tr('theme')}</h2></div><div class="actions"><button class="btn" id="themeMore">${theme==='dark'?tr('dark'):tr('light')}</button><button class="btn" id="healthBtn">${tr('system')}</button></div><div id="healthBox" style="margin-top:10px"></div></div><div class="panel" style="margin-top:12px"><div class="section-title"><h2>${tr('language')}</h2></div><div class="grid3"><button class="btn ${lang==='ar'?'primary':''}" id="la">العربية</button><button class="btn ${lang==='fr'?'primary':''}" id="lf">Français</button><button class="btn ${lang==='en'?'primary':''}" id="le">English</button></div></div><div class="panel" style="margin-top:12px"><div class="section-title"><div><h2>${tr('planner')}</h2><p class="muted">${tr('generate')}</p></div></div><select id="goal" class="select"><option value="lose">${tr('lose')}</option><option value="maintain" selected>${tr('maintain')}</option><option value="gain">${tr('gain')}</option></select><input id="daily" class="field" type="number" min="1200" max="5000" value="${Number(localStorage.getItem('sm-target')||2000)}" style="margin-top:8px"><textarea id="prefs" class="textarea" style="margin-top:8px" placeholder="${tr('prefsPh')}"></textarea><button class="btn gold" id="planBtn" style="width:100%;margin-top:8px">${tr('generate')}</button><div id="planResult" style="margin-top:12px"></div></div><div class="panel" style="margin-top:12px"><div class="section-title"><h2>${tr('history')} (${hist.length})</h2><button class="btn" id="clearHist">${tr('clear')}</button></div>${history.length?history.map(x=>`<div class="list-item" style="margin-top:7px"><b>${esc(x.name)}</b><div class="meta">${x.cal} ${tr('calories')} · ${new Date(x.time).toLocaleDateString(lang)}</div></div>`).join(''):`<div class="empty">${tr('empty')}</div>`}</div><div class="panel" style="margin-top:12px"><div class="section-title"><h2>${tr('shopping')}</h2><button class="btn" id="export">${tr('export')}</button></div>${shop.size?[...shop].map(x=>`<label class="list-item" style="display:flex;gap:8px;align-items:center"><input type="checkbox">${esc(x)}</label>`).join(''):`<div class="empty">${tr('shoppingEmpty')}</div>`}<button class="btn danger" id="clearShop" style="width:100%;margin-top:9px">${tr('clearList')}</button></div>`;$('#themeMore').onclick=toggleTheme;$('#healthBtn').onclick=health;$('#la').onclick=()=>setLang('ar');$('#lf').onclick=()=>setLang('fr');$('#le').onclick=()=>setLang('en');$('#daily').oninput=e=>localStorage.setItem('sm-target',String(Math.min(5000,Math.max(1200,Number(e.target.value)||2000))));$('#planBtn').onclick=planner;$('#clearHist').onclick=()=>{hist=[];localStorage.setItem('sm-history','[]');more()};$('#clearShop').onclick=()=>{shop.clear();localStorage.setItem('sm-shop','[]');more()};$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([...shop].join('\\n'),{type:'text/plain'}));a.download='smartmeal-shopping.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}}
function render(){home();analyze();recipes();more();['home','analyze','recipes','more'].forEach(id=>$('#'+id).classList.toggle('active',id===page));nav();applyTheme()}
$('#themeBtn').onclick=toggleTheme;$('#langBtn').onclick=()=>setLang(lang==='ar'?'fr':lang==='fr'?'en':'ar');$('#searchBtn').onclick=()=>{show('recipes');setTimeout(()=>$('#rq')?.focus(),0)};$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.page));$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
function loadImage(file){if(!file)return;const max=1600,q=.8;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);image=c.toDataURL('image/jpeg',q);URL.revokeObjectURL(url);show('analyze')};img.src=url}
$('#camera').onchange=e=>loadImage(e.target.files?.[0]);$('#gallery').onchange=e=>loadImage(e.target.files?.[0]);
document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';render();
</script></body></html>
