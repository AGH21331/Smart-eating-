<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08120f">
<meta name="description" content="Smart Meal PRO — nutrition, recipes and AI meal analysis">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<title>Smart Meal PRO</title>
</head>
<body>
<div class="app">
<header class="top">
<div class="brand"><img src="/smartmeal-icon-192.png" alt="Smart Meal"><div><h1>Smart Meal PRO</h1><p id="brandTag"></p></div></div>
<div class="top-actions">
<button class="icon" id="searchBtn" aria-label="Search">⌕</button>
<button class="icon" id="themeBtn" aria-label="Theme">☼</button>
<button class="icon lang-chip" id="langBtn" aria-label="Language">AR</button>
</div>
</header>
<main><section id="home" class="screen active"></section><section id="analyze" class="screen"></section><section id="recipes" class="screen"></section><section id="more" class="screen"></section></main>
</div>
<nav class="nav" aria-label="Main navigation"><button data-page="home">⌂<span></span></button><button data-page="analyze">✦<span></span></button><button data-page="recipes">▣<span></span></button><button data-page="more">☰<span></span></button></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<input id="camera" type="file" accept="image/jpeg,image/png,image/webp" capture="environment" hidden><input id="gallery" type="file" accept="image/jpeg,image/png,image/webp" hidden>
<script src="/app.js" defer></script>
</body>
</html>
